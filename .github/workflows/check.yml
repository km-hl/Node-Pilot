name: NodePilot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Public source privacy and scope audit
        run: python3 tools/privacy_audit.py
      - name: Unit and transaction tests
        run: python3 -m unittest discover -s tests -v
      - name: Real loopback Reality target TLS and HTTP screening
        run: python3 tools/target_smoke.py --local
      - name: Bash syntax and shellcheck
        run: |
          bash -n install.sh
          shellcheck install.sh
          python3 nodepilot self-check
          python3 -m compileall -q nodepilot nodepilot_pkg tools tests
      - name: Official verified core checks
        run: python3 tools/native_check.py --download
      - name: Official Mihomo export parser
        run: python3 tools/mihomo_check.py --download
      - name: Real Caddy local IPv4 and IPv6 listeners
        run: python3 tools/http_family_smoke.py
      - name: Reproducible packaging
        run: |
          python3 tools/package.py --archive /tmp/nodepilot-a.tar.gz
          python3 tools/package.py --archive /tmp/nodepilot-b.tar.gz
          cmp /tmp/nodepilot-a.tar.gz /tmp/nodepilot-b.tar.gz
          python3 tools/package.py --repo km-hl/Node-Pilot --tag v0.4.0
          python3 tools/release_audit.py --repo km-hl/Node-Pilot --tag v0.4.0
